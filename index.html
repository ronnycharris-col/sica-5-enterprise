<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCH Systems | Sistema Integral de Control de Acceso</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="login">

    <div class="logo-rch">

        <h1>RCH <span>Systems</span></h1>

        <p class="tituloSistema">
            Sistema Integral de Control de Acceso
        </p>

        <small class="version">
            Enterprise 1.0
        </small>

    </div>

    <div class="bienvenida">
        <h2>Bienvenido</h2>
        <p>Ingrese sus credenciales para continuar</p>
    </div>

    <div class="campo">

        <label for="usuario">👤 Usuario</label>

        <input
            type="text"
            id="usuario"
            placeholder="Ingrese su usuario">

    </div>

    <div class="campo">

        <label for="clave">🔒 Contraseña</label>

        <input
            type="password"
            id="clave"
            placeholder="Ingrese su contraseña">

    </div>

    <button id="btnIngresar">

        🔐 Ingresar al Sistema

    </button>

</div>

    </div>

    <script type="module" src="js/login.js"></script>

</body>

</html>
