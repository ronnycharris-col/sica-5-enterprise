<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
SICA Enterprise - Permisos Usuario
</title>


<style>

body{

    font-family:Arial;
    background:#f4f6f9;
    padding:30px;

}


.card{

    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;

}


.permiso{

    padding:10px;
    border-bottom:1px solid #ddd;

}


button{

    background:#0b57d0;
    color:white;
    padding:10px 20px;
    border:0;
    border-radius:6px;
    cursor:pointer;

}

</style>


</head>


<body>


<h1>
SICA Enterprise
</h1>


<h2>
Configuración de permisos
</h2>


<div class="card">


<h3 id="nombreUsuario">
Usuario
</h3>


<div class="permiso">
<input type="checkbox" id="dashboard">
Dashboard
</div>


<div class="permiso">
<input type="checkbox" id="empleados">
Empleados
</div>


<div class="permiso">
<input type="checkbox" id="operadores">
Operadores
</div>


<div class="permiso">
<input type="checkbox" id="puntosVenta">
Puntos de Venta
</div>


<div class="permiso">
<input type="checkbox" id="horas">
Horas
</div>


<div class="permiso">
<input type="checkbox" id="reportes">
Reportes
</div>


<div class="permiso">
<input type="checkbox" id="usuarios">
Usuarios
</div>


<div class="permiso">
<input type="checkbox" id="seguridad">
Seguridad
</div>


<div class="permiso">
<input type="checkbox" id="configuracion">
Configuración
</div>

<div class="permiso">
<input type="checkbox" id="mantenimiento">
Mantenimiento
</div>

<br>


<button id="guardar">
Guardar permisos
</button>


</div>



<script type="module" src="js/permisos-usuario.js"></script>


</body>

</html>
